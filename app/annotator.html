<!doctype html>
<meta charset="utf-8">
<title>Frametape · annotate</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root { color-scheme: dark; --bg:#101216; --panel:#1b1e24; --line:#323844; --fg:#e4e7ec; --dim:#8b93a1; --accent:#ffb53d; }
* { box-sizing: border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px/1.4 system-ui, sans-serif; overflow:hidden; }
#stage { position:absolute; inset:0 0 150px 0; background:#000; }
#frame { position:absolute; }
#frame video, #frame img, #frame canvas { position:absolute; inset:0; width:100%; height:100%; }
#label { position:absolute; display:none; background:#000c; color:#fff; border:1px solid var(--accent); font:inherit; padding:2px 4px; resize:none; z-index:3; }
#toolbar { position:absolute; display:flex; flex-direction:column; gap:4px; width:52px; padding:4px; background:#1b1e24e6; border:1px solid var(--line); border-radius:6px; z-index:2; }
#toolbar button { width:42px; height:32px; padding:0; font-size:11px; }
#toolbar input[type=color] { width:36px; height:24px; padding:0; border:0; background:none; }
#toolbar input[type=range] { width:36px; }
button { background:#262b33; color:var(--fg); border:1px solid var(--line); border-radius:4px; font:inherit; cursor:pointer; }
button.on { background:var(--accent); border-color:var(--accent); color:#000; }
#scrob { position:absolute; left:0; right:0; bottom:0; height:150px; background:var(--panel); border-top:1px solid var(--line); }
#transport { height:28px; display:flex; gap:4px; align-items:center; padding:3px 8px; }
#transport button { width:44px; height:26px; padding:0; }
#transport span { margin-left:8px; } #status { color:var(--dim); margin-left:auto !important; }
#track { display:block; width:100%; height:122px; }
button:hover { background:#39404c; } button:focus-visible, input:focus-visible, textarea:focus-visible { outline:2px solid var(--accent);outline-offset:2px; }
::selection { background:var(--accent);color:#101216; } input,textarea { accent-color:var(--accent);caret-color:var(--accent); }
#status { max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; } #clock { font-variant-numeric:tabular-nums; }
@media(max-width:650px) { #transport { flex-wrap:wrap;height:58px; } #track {height:92px;} #status {max-width:95%;font-size:11px;} }
</style>
<div id="stage">
  <div id="frame"><video id="v" muted preload="none"></video><img id="still" alt="Original recorded frame"><span id="coverage" style="position:absolute;top:8px;right:12px;background:#101216dd;padding:4px 8px"></span><canvas id="ink" aria-label="Annotation canvas"></canvas><textarea id="label" rows="1" aria-label="Annotation text"></textarea></div>
  <div id="toolbar"></div>
</div>
<div id="scrob">
  <div id="transport">
    <button id="first" title="First frame (Home)">First</button><button id="back" title="Previous frame (←)">Back</button>
    <button id="play" title="Play / pause (Space)">Play</button><button id="fwd" title="Next frame (→)">Next</button><button id="last" title="Last frame (End)">Last</button>
    <span id="clock"></span><button id="save" style="width:auto;padding:0 8px;margin-left:12px" title="Ctrl+S">Save</button><span id="status"></span>
  </div>
  <canvas id="track"></canvas>
</div>
<script>const TAKE = __DATA__; const MARKS = __MARKS__;</script>
<script>
// Source frames own the timeline; encoded picture identity is explicit, including omissions.
const $ = (id) => document.getElementById(id);
const v = $('v'), ink = $('ink'), track = $('track'), label = $('label');
const FPS = TAKE.fps, N = TAKE.frames, TOLERANCE = 0.015;
const BASE = new URL('../', location.href);
const endpoint = (part) => new URL(part + '/' + TAKE.id, BASE);
const still = $('still');
let revision = TAKE.revision, saving = false, savedDoc = JSON.stringify(MARKS);
const DEFAULT_COLOUR = [255, 72, 72], DEFAULT_WIDTH = 0.0035, DEFAULT_TEXT_SIZE = 0.035;
const TOOLS = [['select', 'Move', 'Select and move'], ['rectangle', 'Box', 'Box'], ['ellipse', 'Oval', 'Ellipse'], ['brush', 'Pen', 'Soft brush'], ['arrow', 'Arrow', 'Arrow'], ['text', 'Text', 'Text'], ['erase', 'Erase', 'Erase']];
let doc = MARKS || { version: 2, containers: [] };
let cur = 0, playing = false, playStart = 0, sel = -1, tool = 'rectangle', colour = DEFAULT_COLOUR, width = DEFAULT_WIDTH;
let drag = null, moving = null, editing = null, undo = [], redo = [], handle = null, dirty = false;
try { const s = JSON.parse(localStorage.getItem('tools') || '{}'); tool = s.tool || tool; colour = s.colour || colour; width = s.width || width; } catch (e) {}


const covers = (c, f) => c.start_frame <= f && f <= c.end_frame;
const hex = (c) => '#' + c.map((x) => x.toString(16).padStart(2, '0')).join('');
function snapshot() { undo.push(JSON.stringify(doc)); redo = []; }
function changed() {
  dirty = true;
  $('status').textContent = 'Unsaved changes';
  clearTimeout(changed.timer); changed.timer = setTimeout(save, 600);
  draw();
}
function step(from, to) { if (!from.length) return; to.push(JSON.stringify(doc)); doc = JSON.parse(from.pop()); sel = Math.min(sel, doc.containers.length - 1); changed(); }

// Layout: the frame letterboxed in the stage at the video's aspect, the toolbar at its top left.
function layout() {
  const stage = $('stage').getBoundingClientRect(), aspect = still.naturalWidth && still.naturalHeight ? still.naturalWidth / still.naturalHeight : v.videoWidth && v.videoHeight ? v.videoWidth / v.videoHeight : 16 / 9;
  const available = Math.max(1, stage.width - 64);
  let w = available, h = w / aspect;
  if (h > stage.height) { h = stage.height; w = h * aspect; }
  const f = $('frame'); f.style.left = 64 + (available - w) / 2 + 'px'; f.style.top = (stage.height - h) / 2 + 'px'; f.style.width = w + 'px'; f.style.height = h + 'px';
  const dpr = devicePixelRatio || 1;
  ink.width = Math.round(w * dpr); ink.height = Math.round(h * dpr);
  track.width = Math.round(track.clientWidth * dpr); track.height = Math.round(track.clientHeight * dpr);
  $('toolbar').style.left = '6px'; $('toolbar').style.top = '8px';
  draw();
}

function seek(f) {
  if (!N) { $('coverage').textContent = 'This recording contains channel events without video frames'; return; }
  cur = Math.max(0, Math.min(N - 1, Math.round(f)));
  const image = TAKE.timeline[cur]?.video_frame;
  v.style.visibility = 'hidden';
  if (v.readyState && image != null) v.currentTime = (image + 0.1) / FPS;
  still.style.visibility = 'hidden';
  $('coverage').textContent = image == null ? 'No captured image for this frame' : 'Loading original frame…';
  if (image != null) {
    const index = cur, next = new Image();
    next.onload = () => { if (cur === index && !playing) { still.src = next.src; still.style.visibility = 'visible'; $('coverage').textContent = 'Original frame'; layout(); } };
    next.onerror = () => { if (cur === index) $('coverage').textContent = 'Image unavailable · source remains in recording'; };
    next.src = new URL('frame/' + TAKE.id + '/' + cur, BASE);
  }
  parent.postMessage({ type: 'frame', id: TAKE.id, frame: cur }, location.origin);
  draw();
}
function setPlaying(on) {
  if (!N) return;
  playing = on;
  $('play').textContent = on ? 'Pause' : 'Play';
  if (on) {
    playStart = performance.now() - TAKE.timeline[cur].timestamp_ns / 1e6;
    still.style.visibility = 'hidden';
    v.style.visibility = TAKE.timeline[cur].video_frame == null ? 'hidden' : 'visible';
    $('coverage').textContent = 'Motion preview · pause for original pixels';
    if (!v.getAttribute('src')) v.src = endpoint('video');
    v.pause();
  } else { v.pause(); seek(cur); }
}
const follow = () => {
  if (playing) {
    const elapsed = (performance.now() - playStart) * 1e6;
    const found = TAKE.timeline.findLastIndex((f) => f.timestamp_ns <= elapsed);
    if (found >= 0 && found !== cur) {
      cur = found;
      const image = TAKE.timeline[cur].video_frame;
      v.style.visibility = image == null ? 'hidden' : 'visible';
      if (v.readyState && image != null) v.currentTime = (image + 0.1) / FPS;
      $('coverage').textContent = image == null ? 'No captured image for this frame' : 'Motion preview · pause for original pixels';
      parent.postMessage({type:'frame',id:TAKE.id,frame:cur},location.origin);
    }
    const last = TAKE.timeline[N - 1];
    if (elapsed >= last.timestamp_ns + last.duration_ns) setPlaying(false);
    draw();
  }
  requestAnimationFrame(follow);
};
requestAnimationFrame(follow);

// Marks.
function points(m) { return m.mark === 'stroke' ? m.points : m.mark === 'arrow' ? [m.from, m.to] : m.mark === 'text' ? [m.at] : [m.a, m.b]; }
function translate(m, d) {
  const t = (p) => [p[0] + d[0], p[1] + d[1]];
  if (m.mark === 'stroke') m.points = m.points.map(t); else if (m.mark === 'arrow') { m.from = t(m.from); m.to = t(m.to); }
  else if (m.mark === 'text') m.at = t(m.at); else { m.a = t(m.a); m.b = t(m.b); }
}
function segment(p, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], l = dx * dx + dy * dy, t = l ? Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / l)) : 0;
  return Math.hypot(p[0] - a[0] - t * dx, p[1] - a[1] - t * dy);
}
function hit(m, p) {
  if (m.mark === 'text') { const s = m.size || DEFAULT_TEXT_SIZE; return p[0] >= m.at[0] - TOLERANCE && p[0] <= m.at[0] + s * 0.6 * m.text.length && Math.abs(p[1] - m.at[1]) < s; }
  if (m.mark === 'stroke' || m.mark === 'arrow') { const q = points(m); return q.some((a, i) => i && segment(p, q[i - 1], a) < TOLERANCE); }
  const [x0, x1] = [Math.min(m.a[0], m.b[0]), Math.max(m.a[0], m.b[0])], [y0, y1] = [Math.min(m.a[1], m.b[1]), Math.max(m.a[1], m.b[1])];
  if (m.mark === 'ellipse') {
    const rx = (x1 - x0) / 2, ry = (y1 - y0) / 2, r = Math.hypot((p[0] - x0 - rx) / (rx || 1e-6), (p[1] - y0 - ry) / (ry || 1e-6));
    return Math.abs(r - 1) * Math.min(rx, ry) < TOLERANCE || r < 1;
  }
  return p[0] > x0 - TOLERANCE && p[0] < x1 + TOLERANCE && p[1] > y0 - TOLERANCE && p[1] < y1 + TOLERANCE;
}
function found(p) {
  for (let c = doc.containers.length - 1; c >= 0; c--) {
    if (!covers(doc.containers[c], cur)) continue;
    const marks = doc.containers[c].marks;
    for (let m = marks.length - 1; m >= 0; m--) if (hit(marks[m], p)) return [c, m];
  }
  return null;
}
function addMark(mark) {
  snapshot();
  let c = sel >= 0 && doc.containers[sel] && covers(doc.containers[sel], cur) ? sel : -1;
  if (c < 0) { doc.containers.push({ start_frame: cur, end_frame: cur, marks: [] }); c = doc.containers.length - 1; }
  doc.containers[c].marks.push(mark);
  sel = c;
  changed();
}

function paint(c, m, W, H, selected) {
  const s = Math.min(W, H), X = (p) => p[0] * W, Y = (p) => p[1] * H;
  const shape = () => {
    c.beginPath();
    if (m.mark === 'rectangle') c.rect(X(m.a), Y(m.a), X(m.b) - X(m.a), Y(m.b) - Y(m.a));
    else if (m.mark === 'ellipse') c.ellipse((X(m.a) + X(m.b)) / 2, (Y(m.a) + Y(m.b)) / 2, Math.abs(X(m.b) - X(m.a)) / 2, Math.abs(Y(m.b) - Y(m.a)) / 2, 0, 0, 2 * Math.PI);
    else { const q = points(m); q.forEach((p, i) => (i ? c.lineTo(X(p), Y(p)) : c.moveTo(X(p), Y(p)))); }
    if (m.mark === 'arrow') { const [a, b] = [m.from, m.to], ang = Math.atan2(Y(b) - Y(a), X(b) - X(a)), l = 0.03 * s;
      for (const k of [-0.5, 0.5]) { c.moveTo(X(b), Y(b)); c.lineTo(X(b) - l * Math.cos(ang + k), Y(b) - l * Math.sin(ang + k)); } }
    c.stroke();
  };
  c.lineCap = c.lineJoin = 'round';
  if (m.mark === 'text') {
    const size = (m.size || DEFAULT_TEXT_SIZE) * s;
    c.font = `600 ${size}px system-ui, sans-serif`; c.textBaseline = 'middle';
    c.fillStyle = selected ? '#000d' : '#0009'; c.fillText(m.text, X(m.at) + 1.5, Y(m.at) + 1.5);
    c.fillStyle = hex(m.colour || DEFAULT_COLOUR); c.fillText(m.text, X(m.at), Y(m.at));
    return;
  }
  const w = Math.max(1, (m.width || DEFAULT_WIDTH) * s);
  if (selected) { c.strokeStyle = '#0009'; c.lineWidth = w + 4; shape(); }
  c.strokeStyle = hex(m.colour || DEFAULT_COLOUR); c.lineWidth = w; shape();
}
function draft() {
  if (!drag) return null;
  if (tool === 'brush') return { mark: 'stroke', points: drag.points, colour, width };
  if (tool === 'arrow') return { mark: 'arrow', from: drag.start, to: drag.at, colour, width };
  return { mark: tool, a: drag.start, b: drag.at, colour, width };
}

function draw() {
  const c = ink.getContext('2d'), W = ink.width, H = ink.height;
  c.clearRect(0, 0, W, H);
  doc.containers.forEach((k, i) => covers(k, cur) && k.marks.forEach((m) => paint(c, m, W, H, i === sel)));
  const d = draft(); if (d) paint(c, d, W, H, false);
  $('clock').textContent = N ? `Frame ${cur} / ${N - 1} · ${((TAKE.timeline[cur]?.timestamp_ns || 0) / 1e9).toFixed(3)} s` : 'No recorded frames';
  [...$('toolbar').querySelectorAll('button')].forEach((b) => { b.classList.toggle('on', b.dataset.t === tool); b.setAttribute('aria-pressed', String(b.dataset.t === tool)); });
  ink.style.cursor = tool === 'select' ? 'default' : tool === 'text' ? 'text' : 'crosshair';
  drawTrack();
}

// Scrobbler: a scrub track across the take and one lane per container, dragged by its ends or its bar.
const SCRUB = 26, LANE = 18, HANDLE = 7, PAD = 10;
let grab = null;
function frameAt(x) { const w = track.clientWidth - 2 * PAD; return Math.round(((x - PAD) / w) * (N - 1)); }
function xAt(f) { return PAD + (f / Math.max(1, N - 1)) * (track.clientWidth - 2 * PAD); }
function laneRect(i) { return { y: SCRUB + 6 + i * (LANE + 4) - laneScroll, h: LANE }; }
let laneScroll = 0;
function drawTrack() {
  const dpr = devicePixelRatio || 1, c = track.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, track.clientWidth, track.clientHeight);
  c.fillStyle = '#262b33'; c.fillRect(PAD, 6, track.clientWidth - 2 * PAD, SCRUB - 10);
  c.fillStyle = '#8b93a1'; c.font = '10px system-ui';
  const tick = Math.max(1, Math.pow(10, Math.ceil(Math.log10(N / 12))));
  for (let f = 0; f < N; f += tick) { c.fillRect(xAt(f), 6, 1, 6); c.fillText(f, xAt(f) + 2, SCRUB - 6); }
  doc.containers.forEach((k, i) => {
    const r = laneRect(i); if (r.y + r.h < SCRUB || r.y > track.clientHeight) return;
    const x0 = xAt(k.start_frame) - 3, x1 = xAt(k.end_frame) + 3;
    c.fillStyle = i === sel ? '#ffb53d' : '#4a5260'; c.fillRect(x0, r.y, x1 - x0, r.h);
    c.fillStyle = i === sel ? '#000' : '#e4e7ec'; c.fillRect(x0, r.y, 2, r.h); c.fillRect(x1 - 2, r.y, 2, r.h);
    c.fillStyle = '#e4e7ec'; c.fillText(`${k.start_frame}–${k.end_frame} · ${k.marks.length}`, x1 + 6, r.y + 12);
  });
  c.fillStyle = '#fff'; c.fillRect(xAt(cur) - 1, 0, 2, track.clientHeight);
}
track.addEventListener('pointerdown', (e) => {
  track.setPointerCapture(e.pointerId);
  const x = e.offsetX, y = e.offsetY;
  for (let i = 0; i < doc.containers.length; i++) {
    const k = doc.containers[i], r = laneRect(i), x0 = xAt(k.start_frame) - 3, x1 = xAt(k.end_frame) + 3;
    if (y < r.y || y > r.y + r.h || x < x0 - HANDLE || x > x1 + HANDLE) continue;
    sel = i; snapshot();
    // On a bar too short to tell its ends apart, the first move's direction picks the end.
    const start = Math.abs(x - x0) <= HANDLE, end = Math.abs(x - x1) <= HANDLE;
    grab = { i, mode: start && end ? 'either' : start ? 'start' : end ? 'end' : 'whole', from: frameAt(x), start: k.start_frame, end: k.end_frame };
    draw(); return;
  }
  grab = { mode: 'seek' }; if (playing) setPlaying(false); seek(frameAt(x));
});
track.addEventListener('pointermove', (e) => {
  if (!grab) return;
  const f = Math.max(0, Math.min(N - 1, frameAt(e.offsetX)));
  if (grab.mode === 'seek') return seek(f);
  const k = doc.containers[grab.i];
  if (grab.mode === 'either') { if (f === grab.from) return; grab.mode = f > grab.from ? 'end' : 'start'; }
  if (grab.mode === 'start') { k.start_frame = Math.min(f, grab.end); }
  else if (grab.mode === 'end') { k.end_frame = Math.max(f, grab.start); }
  else { const d = Math.max(-grab.start, Math.min(N - 1 - grab.end, f - grab.from)); k.start_frame = grab.start + d; k.end_frame = grab.end + d; }
  draw();
});
track.addEventListener('pointerup', () => {
  if (grab && grab.mode !== 'seek') { const k = doc.containers[grab.i]; if (k.start_frame === grab.start && k.end_frame === grab.end) undo.pop(); else changed(); }
  grab = null;
});
track.addEventListener('wheel', (e) => { laneScroll = Math.max(0, laneScroll + e.deltaY * 0.5); drawTrack(); e.preventDefault(); }, { passive: false });

// Drawing on the frame.
const uv = (e) => { const r = ink.getBoundingClientRect(); return [Math.max(0,Math.min(1,(e.clientX - r.left) / r.width)), Math.max(0,Math.min(1,(e.clientY - r.top) / r.height))]; };
ink.addEventListener('pointerdown', (e) => {
  if (editing) commitText();
  if (playing) setPlaying(false);
  const p = uv(e);
  ink.setPointerCapture(e.pointerId);
  if (tool === 'select') { const f = found(p); if (f) { snapshot(); sel = f[0]; moving = { c: f[0], m: f[1], last: p, moved: false }; draw(); } else { sel = -1; draw(); } }
  else if (tool === 'erase') { const f = found(p); if (f) { snapshot(); doc.containers[f[0]].marks.splice(f[1], 1); changed(); } }
  else if (tool === 'text') beginText(p, null);
  else drag = { start: p, at: p, points: [p] };
});
ink.addEventListener('pointermove', (e) => {
  const p = uv(e);
  if (moving) { translate(doc.containers[moving.c].marks[moving.m], [p[0] - moving.last[0], p[1] - moving.last[1]]); moving.last = p; moving.moved = true; draw(); }
  else if (drag) { drag.at = p; if (tool === 'brush') drag.points.push(p); draw(); }
});
ink.addEventListener('pointerup', () => {
  if (moving) { if (moving.moved) changed(); else undo.pop(); moving = null; }
  if (drag) {
    const d = draft(); drag = null;
    const big = d.mark === 'stroke' ? d.points.length > 1 : Math.hypot((d.b || d.to)[0] - (d.a || d.from)[0], (d.b || d.to)[1] - (d.a || d.from)[1]) > 0.004;
    if (big) addMark(d); else draw();
  }
});
ink.addEventListener('dblclick', (e) => {
  if (tool !== 'select') return;
  const f = found(uv(e)); if (!f) return;
  const m = doc.containers[f[0]].marks[f[1]]; if (m.mark === 'text') beginText(m.at, f);
});

// Text: typed in place, committed when clicked away from or on Enter; Escape cancels.
function beginText(at, existing) {
  editing = { at, existing };
  const r = ink.getBoundingClientRect(), s = Math.min(r.width, r.height) * DEFAULT_TEXT_SIZE;
  label.style.left = at[0] * r.width + 'px'; label.style.top = at[1] * r.height - s + 'px'; label.style.fontSize = s + 'px';
  label.style.display = 'block'; label.value = existing ? doc.containers[existing[0]].marks[existing[1]].text : '';
  setTimeout(() => label.focus());
}
function commitText() {
  const e = editing; editing = null; label.style.display = 'none';
  const text = label.value.trim();
  if (e.existing) {
    const [c, m] = e.existing, mark = doc.containers[c].marks[m];
    if (text === mark.text) return;
    snapshot(); if (text) mark.text = text; else doc.containers[c].marks.splice(m, 1); changed();
  } else if (text) addMark({ mark: 'text', at: e.at, text, size: DEFAULT_TEXT_SIZE, colour });
}
label.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { commitText(); e.preventDefault(); }
  else if (e.key === 'Escape') { editing = null; label.style.display = 'none'; }
  e.stopPropagation();
});
label.addEventListener('blur', () => editing && commitText());

// Toolbar.
for (const [t, icon, name] of TOOLS) {
  const b = document.createElement('button'); b.dataset.t = t; b.textContent = icon; b.title = name; b.setAttribute('aria-label', name); b.setAttribute('aria-pressed', 'false');
  b.onclick = () => { tool = t; keepTools(); draw(); }; $('toolbar').append(b);
}
const swatch = Object.assign(document.createElement('input'), { type: 'color', value: hex(colour), title: 'Ink' });
swatch.oninput = () => { colour = [1, 3, 5].map((i) => parseInt(swatch.value.slice(i, i + 2), 16)); keepTools(); };
const stroke = Object.assign(document.createElement('input'), { type: 'range', min: 0.001, max: 0.02, step: 0.0005, value: width, title: 'Stroke width' });
stroke.oninput = () => { width = +stroke.value; keepTools(); };
$('toolbar').append(swatch, stroke);
function keepTools() { try { localStorage.setItem('tools', JSON.stringify({ tool, colour, width })); } catch (e) {} }

// Save serialized revisions inside the single archive. Failed writes retain the authored document.
async function save() {
  if (saving) return;
  saving = true;
  try {
    while (JSON.stringify(doc) !== savedDoc) {
      const text = JSON.stringify(doc);
      $('status').textContent = 'Saving recording…';
      const response = await fetch(endpoint('annotations'), { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({revision, annotations:JSON.parse(text)}) });
      if (!response.ok) throw new Error(await response.text());
      revision = (await response.json()).revision; savedDoc = text;
    }
    dirty = false; $('status').textContent = 'Saved in recording';
  } catch (e) { dirty = true; $('status').textContent = 'Save failed: ' + e.message; }
  finally { saving = false; }
}
$('save').onclick = save;
$('first').onclick = () => seek(0); $('last').onclick = () => seek(N - 1);
$('back').onclick = () => { setPlaying(false); seek(cur - 1); }; $('fwd').onclick = () => { setPlaying(false); seek(cur + 1); };
$('play').onclick = () => setPlaying(!playing);
addEventListener('keydown', (e) => {
  if (editing || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const k = e.key;
  if (e.ctrlKey && (k === 'z' || k === 'Z')) { e.shiftKey ? step(redo, undo) : step(undo, redo); e.preventDefault(); }
  else if (e.ctrlKey && k === 'y') { step(redo, undo); e.preventDefault(); }
  else if (e.ctrlKey && k === 's') { save(); e.preventDefault(); }
  else if (k === ' ') { setPlaying(!playing); e.preventDefault(); }
  else if (k === 'ArrowLeft' || k === 'ArrowRight') { setPlaying(false); seek(cur + (k === 'ArrowLeft' ? -1 : 1) * (e.shiftKey ? 10 : 1)); e.preventDefault(); }
  else if (k === 'Home') seek(0); else if (k === 'End') seek(N - 1);
  else if ((k === 'Delete' || k === 'Backspace') && sel >= 0) { snapshot(); doc.containers.splice(sel, 1); sel = -1; changed(); }
});
addEventListener('beforeunload', (e) => { if (dirty) e.preventDefault(); });
v.addEventListener('loadedmetadata', () => { layout(); seek(cur); });
v.addEventListener('seeked', draw);
v.addEventListener('error', () => { $('status').textContent = 'Motion preview unavailable; step to inspect original frames'; });
addEventListener('resize', layout);
$('status').textContent = 'Annotations saved in recording';
if (!N) { document.querySelectorAll('#toolbar button,#transport button').forEach((b) => b.disabled = true); ink.style.pointerEvents = 'none'; parent.postMessage({type:'frame',id:TAKE.id,frame:null},location.origin); }
layout(); seek(0);
</script>
