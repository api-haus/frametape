<style>
:root{color-scheme:dark;--bg:#101216;--panel:#1b1e24;--line:#323844;--fg:#e4e7ec;--dim:#a8afbb;--accent:#ffb53d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 system-ui,sans-serif;height:100dvh;display:grid;grid-template-rows:50px 1fr;overflow:hidden}

    <ul id="recordings"></ul><p id="notice" class="notice" role="status"></p>
